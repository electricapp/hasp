name: Security
# `cargo-audit` and `self-scan` are required PR status checks; no
# `paths-ignore` here, because a workflow skipped by a path filter never
# reports its checks and a docs-only PR then hangs on "Expected — waiting
# for status".
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny@0.19.5 --locked

      - name: Audit dependencies
        run: cargo audit

      # License / bans / advisories / sources policy from deny.toml.
      - name: cargo deny check
        run: cargo deny check --config deny.toml

  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Build hasp
        env:
          GITHUB_REPO: electricapp/hasp
        run: cargo build --release

      - name: Scan own workflows (must pass clean)
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./target/release/hasp --paranoid --allow-unsandboxed
