name: CI
# `lint` and the `test` matrix variants are required PR status checks; no
# `paths-ignore` here, because a workflow skipped by a path filter never
# reports its checks and a docs-only PR then hangs on "Expected — waiting
# for status".
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy
          rustup default 1.94.0

      - name: Clippy (including test code)
        run: cargo clippy --tests -- -D warnings

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sandbox: true
          - os: macos-latest
            sandbox: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Build
        run: cargo build --release

      # Proptest cases: bumped from the 256 default to 2000 to give
      # parser/encoder properties a more meaningful run per CI execution.
      - name: Unit + integration tests
        timeout-minutes: 15
        run: cargo test
        env:
          PROPTEST_CASES: "2000"
          RUST_BACKTRACE: "1"

      # Token-gated tests temporarily disabled: GITHUB_TOKEN rate-limit
      # contention across CI/security/release workflows was causing
      # spurious failures. Re-enable once we move expensive verification
      # to a scheduled workflow or use a higher-quota token.
      # - name: Token-gated tests (GitHub API + sandbox)
      #   run: cargo test -- --ignored
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     PROPTEST_CASES: "2000"

      # TODO(fuzz): add a libFuzzer-based fuzz job. Blocked on cargo-fuzz
      # requiring nightly for coverage/sanitizer instrumentation. Options:
      #   1. Scheduled workflow (cron) that runs `cargo +nightly fuzz run`
      #      for each target in `fuzz/fuzz_targets/` for ~30 min.
      #   2. Submit to OSS-Fuzz for continuous deep fuzzing.
      # Until then, `PROPTEST_CASES=2000` above gives ~20k random inputs
      # per PR across the parser/encoder properties — shallower than
      # libFuzzer but caught on stable Rust every run.

      # On Linux, verify the binary runs with the real OS sandbox (no
      # --allow-unsandboxed). This exercises Landlock + seccomp.  The
      # egress sandbox (cgroup/BPF) requires CAP_BPF which CI runners
      # may lack, so the binary is expected to fail gracefully there.
      - name: Sandboxed smoke test (Linux only)
        if: matrix.sandbox
        run: |
          # --no-verify avoids needing GITHUB_TOKEN
          # Exit 0 or 1 are both acceptable (findings vs. clean);
          # exit 2 = usage error, >128 = signal (crash) — those fail CI.
          set +e
          ./target/release/hasp --no-verify --no-policy --dir tests/fixtures/workflows
          code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::hasp exited $code (expected 0 or 1)"
            exit 1
          fi

  # ── Lint the workflow files themselves (YAML + embedded shell) ──
  # shellcheck ships on the runner, so actionlint also checks the inline
  # bash. Catches dead runner labels, quoting bugs, and bad expressions
  # before they break a tag release (where failures are most expensive).
  # hasp self-scans its workflows for *security* (pins/permissions) via
  # security.yml; actionlint adds *correctness* (syntax/shell) on top.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint (SHA-pinned download + checksum)
        run: |
          VER="1.7.12"
          SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" -o actionlint.tgz
          echo "${SHA}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint

  # ── Flag dependencies declared in Cargo.toml but never used ──
  # cargo-machete catches deps that linger after a refactor — dead weight
  # in the build graph and extra supply-chain surface. hasp is clean today.
  #
  # cargo-machete is installed via `cargo install` rather than
  # taiki-e/install-action: hasp's own --paranoid self-scan (security.yml)
  # denies that action because it isn't from a GitHub-verified publisher and
  # ships no SLSA attestation. Building the tool from a pinned crate keeps the
  # dogfooded scan green without weakening hasp's provenance policy, and
  # matches how the repo already installs cargo-audit/cargo-deny/cargo-sbom.
  unused-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete

